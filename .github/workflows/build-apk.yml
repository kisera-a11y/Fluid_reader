name: Build debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest GitHub-hosted runners ship with the Android SDK (and accepted
      # licenses) preinstalled under ANDROID_HOME already - no separate SDK-setup action
      # needed, and android-actions/setup-android@v3 fails outright trying to install the
      # long-removed legacy "tools" package.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluid-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
